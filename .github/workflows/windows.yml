name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and publish
        shell: pwsh
        run: ./build.ps1 -SelfContained
      - name: Check desktop window starts
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'artifacts/ArchiveBox-win-x64-standalone/ArchiveBox.exe'
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Application exited during startup: $($process.ExitCode)" }
            } while ($process.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($process.MainWindowHandle -eq 0) { throw 'No desktop window was created.' }
            $null = $process.CloseMainWindow()
            if (-not $process.WaitForExit(10000)) { throw 'Application did not close normally.' }
            if ($process.ExitCode -ne 0) { throw "Application exited with code $($process.ExitCode)." }
          }
          finally { if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } }
      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveBox-win-x64
          path: artifacts/*.zip
