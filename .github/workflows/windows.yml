name: .NET Framework 4.8 build and tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test .NET Framework 4.8 application
        shell: pwsh
        run: ./build.ps1
      - name: Check packaged desktop startup
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Check Windows PowerShell diagnostic launcher
        shell: powershell
        run: ./artifacts/ArchiveBox-v0.3.2-win-x64/Diagnose-ArchiveBox.ps1 -SmokeTest
      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveBox-net48-${{ matrix.os }}
          path: artifacts/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots-${{ runner.os }}-${{ strategy.job-index }}
          path: artifacts/smoke-test/screenshots/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: startup-diagnostics-${{ matrix.os }}
          path: artifacts/**/*.log
          if-no-files-found: ignore
