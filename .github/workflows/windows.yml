name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and publish
        shell: pwsh
        run: ./build.ps1 -SelfContained
      - name: Check desktop window starts
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveBox-win-x64
          path: artifacts/*.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: startup-diagnostics
          path: artifacts/smoke-test/*.log
          if-no-files-found: ignore
