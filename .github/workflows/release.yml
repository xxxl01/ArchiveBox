name: Publish .NET Framework 4.8 release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test .NET Framework 4.8 package
        shell: pwsh
        run: ./build.ps1
      - name: Check packaged desktop startup
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Check Windows PowerShell diagnostic launcher
        shell: powershell
        run: ./artifacts/ArchiveBox-v0.3.1-win-x64/Diagnose-ArchiveBox.ps1 -SmokeTest
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Release tag must be vMAJOR.MINOR.PATCH.' }
          $package = Join-Path $PWD "artifacts/ArchiveBox-$env:RELEASE_TAG-win-x64.zip"
          if (-not (Test-Path $package)) { throw 'The package version does not match the release tag.' }
          "{0}  {1}" -f (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant(), [IO.Path]::GetFileName($package) | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8NoBOM
          Copy-Item RELEASE_NOTES.md artifacts/release-notes.md
          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --json isDraft > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --verify-tag --draft --title "ArchiveBox $env:RELEASE_TAG - .NET Framework 4.8" --notes-file artifacts/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create release draft.' }
          }
          gh release upload $env:RELEASE_TAG $package artifacts/SHA256SUMS.txt --repo $env:RELEASE_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release package.' }
          gh release edit $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --target $env:GITHUB_SHA --draft=false --latest --title "ArchiveBox $env:RELEASE_TAG - .NET Framework 4.8" --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots-${{ runner.os }}-${{ strategy.job-index }}
          path: artifacts/smoke-test/screenshots/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-diagnostics
          path: |
            artifacts/**/*.log
            artifacts/*.zip
          if-no-files-found: ignore
